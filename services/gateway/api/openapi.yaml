openapi: 3.0.3
info:
  title: GoCommerce API Gateway
  description: |
    API Gateway for GoCommerce microservices platform.
    Provides a unified entry point with authentication, rate limiting, and routing.
  version: 1.0.0
  contact:
    name: GoCommerce Team

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: auth
    description: Authentication operations
  - name: products
    description: Product catalog operations
  - name: carts
    description: Shopping cart operations
  - name: orders
    description: Order management operations
  - name: payments
    description: Payment processing operations
  - name: inventory
    description: Inventory management operations
  - name: health
    description: Health check operations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request parameters
        details:
          type: object
          additionalProperties: true

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        uptime:
          type: integer
          description: Service uptime in seconds
        dependencies:
          type: object
          properties:
            product:
              $ref: '#/components/schemas/ServiceHealth'
            cart:
              $ref: '#/components/schemas/ServiceHealth'
            order:
              $ref: '#/components/schemas/ServiceHealth'
            payment:
              $ref: '#/components/schemas/ServiceHealth'
            inventory:
              $ref: '#/components/schemas/ServiceHealth'

    ServiceHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        latency_ms:
          type: integer
        last_check:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token (optional)
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token expiry time in seconds
          example: 3600
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                type: string
                enum: [user, admin]

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

paths:
  # ==================== Health ====================
  /health:
    get:
      tags: [health]
      summary: Gateway health check with backend service status
      operationId: healthCheck
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ==================== Authentication ====================
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate user and get JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout user (invalidate token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Successfully logged out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== Product Service Routes ====================
  /api/products:
    get:
      tags: [products]
      summary: List products with pagination and filtering
      operationId: listProducts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: number
            format: float
        - name: max_price
          in: query
          schema:
            type: number
            format: float
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Product list (proxied from product service)
    post:
      tags: [products]
      summary: Create a new product
      operationId: createProduct
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product created (proxied to product service)
        '401':
          description: Unauthorized

  /api/products/{productId}:
    get:
      tags: [products]
      summary: Get product by ID
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found
    put:
      tags: [products]
      summary: Update product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product updated
        '401':
          description: Unauthorized
        '404':
          description: Product not found
    delete:
      tags: [products]
      summary: Delete product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted
        '401':
          description: Unauthorized
        '404':
          description: Product not found

  # ==================== Cart Service Routes ====================
  /api/carts/{userId}:
    get:
      tags: [carts]
      summary: Get user's cart
      operationId: getCart
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cart details
        '401':
          description: Unauthorized
        '404':
          description: Cart not found
    delete:
      tags: [carts]
      summary: Clear cart
      operationId: clearCart
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Cart cleared
        '401':
          description: Unauthorized

  /api/carts/{userId}/items:
    post:
      tags: [carts]
      summary: Add item to cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item added to cart
        '401':
          description: Unauthorized

  /api/carts/{userId}/items/{productId}:
    put:
      tags: [carts]
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cart item updated
        '401':
          description: Unauthorized
        '404':
          description: Item not found
    delete:
      tags: [carts]
      summary: Remove item from cart
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item removed
        '401':
          description: Unauthorized
        '404':
          description: Item not found

  # ==================== Order Service Routes ====================
  /api/orders:
    get:
      tags: [orders]
      summary: List orders with filtering
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Order list
        '401':
          description: Unauthorized
    post:
      tags: [orders]
      summary: Create new order
      operationId: createOrder
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created
        '401':
          description: Unauthorized

  /api/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get order by ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /api/orders/{orderId}/status:
    put:
      tags: [orders]
      summary: Update order status
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order status updated
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /api/orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: Cancel order
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order cancelled
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  # ==================== Payment Service Routes ====================
  /api/payments:
    get:
      tags: [payments]
      summary: List payments with filtering
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Payment list
        '401':
          description: Unauthorized
    post:
      tags: [payments]
      summary: Create new payment
      operationId: createPayment
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Payment created
        '401':
          description: Unauthorized

  /api/payments/{paymentId}:
    get:
      tags: [payments]
      summary: Get payment by ID
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

  /api/payments/{paymentId}/capture:
    post:
      tags: [payments]
      summary: Capture authorized payment
      operationId: capturePayment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment captured
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

  /api/payments/{paymentId}/cancel:
    post:
      tags: [payments]
      summary: Cancel payment
      operationId: cancelPayment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment cancelled
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

  /api/payments/{paymentId}/refund:
    post:
      tags: [payments]
      summary: Refund payment
      operationId: refundPayment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment refunded
        '401':
          description: Unauthorized
        '404':
          description: Payment not found

  # ==================== Inventory Service Routes ====================
  /api/inventory/stocks/{productId}:
    get:
      tags: [inventory]
      summary: Get stock for product
      operationId: getStock
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stock details
        '401':
          description: Unauthorized
        '404':
          description: Stock not found

  /api/inventory/stocks/{productId}/add:
    post:
      tags: [inventory]
      summary: Add stock (restocking)
      operationId: addStock
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stock added
        '401':
          description: Unauthorized

  /api/inventory/stocks/{productId}/set:
    post:
      tags: [inventory]
      summary: Set stock level
      operationId: setStock
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stock set
        '401':
          description: Unauthorized

  /api/inventory/stocks/low:
    get:
      tags: [inventory]
      summary: List low stock products
      operationId: listLowStock
      security:
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Low stock products
        '401':
          description: Unauthorized

  /api/inventory/reservations/{orderId}:
    get:
      tags: [inventory]
      summary: Get reservations for order
      operationId: getReservations
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation list
        '401':
          description: Unauthorized
        '404':
          description: Order not found
