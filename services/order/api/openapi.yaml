openapi: 3.0.3
info:
  title: Order Service API
  description: |
    Order Service manages order lifecycle with event-driven architecture.
    Features:
    - Order state machine (pending → paid → shipped → delivered)
    - Idempotency support for order creation
    - Outbox pattern for reliable event delivery
    - Integration with Payment and Inventory services
  version: 1.0.0
  contact:
    name: GoCommerce Team

servers:
  - url: http://localhost:8082
    description: Local development

tags:
  - name: orders
    description: Order management operations
  - name: health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Returns the health status of the service
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /orders:
    post:
      tags:
        - orders
      summary: Create a new order
      description: Creates a new order with idempotency support
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Order already exists (idempotency)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    get:
      tags:
        - orders
      summary: List orders
      description: Retrieves orders with pagination and filtering
      operationId: listOrders
      parameters:
        - name: user_id
          in: query
          description: Filter by user ID
          schema:
            type: string
        - name: status
          in: query
          description: Filter by order status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: page
          in: query
          description: Page number (starts at 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /orders/{orderId}:
    get:
      tags:
        - orders
      summary: Get order by ID
      description: Retrieves a specific order by its ID
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/status:
    put:
      tags:
        - orders
      summary: Update order status
      description: Updates the order status following state machine rules
      operationId: updateOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/cancel:
    post:
      tags:
        - orders
      summary: Cancel an order
      description: Cancels an order if it's in a cancellable state
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: Order identifier
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum: [healthy]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum:
        - pending
        - awaiting_payment
        - paid
        - fulfilling
        - shipped
        - delivered
        - cancelled
        - failed

    Order:
      type: object
      required:
        - id
        - user_id
        - status
        - items
        - total_cents
        - idempotency_key
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          description: Total price in cents
          example: 15990
        idempotency_key:
          type: string
          description: Unique key for idempotent order creation
        payment_id:
          type: string
          format: uuid
          nullable: true
        tracking_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - product_id
        - product_name
        - quantity
        - unit_price_cents
        - subtotal
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0
        subtotal:
          type: integer
          description: Subtotal for this item (unit_price_cents * quantity)

    CreateOrderRequest:
      type: object
      required:
        - user_id
        - items
        - idempotency_key
      properties:
        user_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        idempotency_key:
          type: string
          description: Unique key to prevent duplicate orders

    CreateOrderItem:
      type: object
      required:
        - product_id
        - product_name
        - quantity
        - unit_price_cents
      properties:
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_id:
          type: string
          format: uuid
          description: Required when transitioning to 'paid' status
        tracking_number:
          type: string
          description: Optional when transitioning to 'shipped' status
        reason:
          type: string
          description: Required for 'cancelled' and 'failed' statuses

    CancelOrderRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          description: Reason for cancellation

    OrderListResponse:
      type: object
      required:
        - orders
        - total
        - page
        - page_size
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
          description: Total number of orders
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
